services:
  api:
    build: {context: ., target: runtime}
    environment: &app-env
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:?required}
      APP_DATABASE_URL: postgresql+psycopg://app:${POSTGRES_PASSWORD:?required}@db/${POSTGRES_DB:-app}
      APP_STORAGE_ENDPOINT: http://storage:8333
      APP_STORAGE_PUBLIC_ENDPOINT: ${APP_STORAGE_PUBLIC_ENDPOINT:?required}
      APP_STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:?required}
      APP_STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:?required}
      APP_QUARANTINE_BUCKET: quarantine
      APP_VALIDATED_BUCKET: validated
      APP_FRONTEND_ORIGIN: ${APP_FRONTEND_ORIGIN:?required}
      APP_QUOTA_HMAC_SECRET: ${APP_QUOTA_HMAC_SECRET:?required}
      APP_SECURE_COOKIES: ${APP_SECURE_COOKIES:-true}
      # Address of the reverse proxy. Without it uvicorn distrusts the forwarded
      # headers and every per-IP quota collapses onto the proxy's own address.
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:?required}
    ports: ["127.0.0.1:${API_PORT:-8000}:8000"]
    depends_on:
      db: {condition: service_healthy}
      storage: {condition: service_healthy}
      buckets: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=20)"]
      interval: 30s
      timeout: 25s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp]
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    command: [postgres, -c, max_connections=40]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U app -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  storage:
    image: chrislusf/seaweedfs:4.53
    # SeaweedFS serves anonymous full access unless an S3 identity file is supplied,
    # so this file is mandatory, not optional. It is written inside the container at
    # start-up from the environment, never baked into the image or the repository.
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mkdir -p /etc/seaweedfs
        printf '{"identities":[{"name":"app","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' "$$STORAGE_ACCESS_KEY" "$$STORAGE_SECRET_KEY" > /etc/seaweedfs/s3.json
        exec weed server -dir=/data -s3 -s3.port=8333 \
          -s3.config=/etc/seaweedfs/s3.json -master.volumeSizeLimitMB=1024
    environment:
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:?required}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:?required}
    ports: ["127.0.0.1:${STORAGE_PORT:-21848}:8333"]
    volumes: ["storage-data:/data"]
    # The master answering proves the process is up; that the S3 gateway is actually
    # usable is proven by the api's own readiness probe, which lists both buckets.
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://localhost:9333/"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  buckets:
    build: {context: ., target: runtime}
    environment: *app-env
    command: [python, -c, "from app.main import initialize_buckets; initialize_buckets()"]
    depends_on:
      storage: {condition: service_healthy}
    restart: "no"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
  tests:
    profiles: [test]
    build: {context: ., target: test}
    command: [pytest, -p, "no:cacheprovider", tests/infra]
    environment:
      <<: *app-env
      F02_STACK_TEST: "1"
      F02_API_URL: http://api:8000
    depends_on:
      api: {condition: service_healthy}
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
  core-tests:
    extends: tests
    network_mode: service:db
    command: [pytest, -p, "no:cacheprovider"]
    environment:
      TEST_DATABASE_URL: postgresql+psycopg://app:${POSTGRES_PASSWORD:?required}@127.0.0.1/${POSTGRES_DB:-app}
volumes:
  postgres-data:
  storage-data:
