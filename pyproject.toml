[project]
name = "nianzeuhub-backend"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1",
  "sqlalchemy>=2.0,<2.1", "psycopg[binary]>=3.2,<4", "alembic>=1.14,<2",
  "pydantic>=2.10,<3", "pydantic-settings>=2.7,<3",
  "argon2-cffi>=23.1,<26", "email-validator>=2.2,<3",
  "minio>=7.2,<8", "pillow>=11,<13", "pypdf>=5,<7", "av>=14,<18",
  "pycountry>=24.6,<27",
]

[dependency-groups]
dev = ["ruff>=0.11,<1", "mypy>=1.15,<2", "pytest>=8.3,<10", "httpx>=0.28,<1"]

[tool.ruff]
target-version = "py313"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.13"
strict = true
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: requires an explicitly supplied local PostgreSQL test database"]
