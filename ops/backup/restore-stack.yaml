# Throwaway stack used only to rehearse and prove a restore.
# Isolated by construction: distinct project name, distinct named volumes, no
# published port, no production credential, no application image, restart "no".
# Bring it up with:
#   COMPOSE_PROJECT_NAME=nianzeuhub-restore \
#   docker compose -f ops/backup/restore-stack.yaml --env-file <restore.env> up -d
services:
  restore-db:
    image: ${BACKUP_PG_IMAGE:-postgres:16-alpine}
    restart: "no"
    cpus: 1.0
    mem_limit: 1g
    pids_limit: 256
    security_opt: ["no-new-privileges:true"]
    environment:
      POSTGRES_USER: ${RESTORE_PGUSER:?required}
      POSTGRES_PASSWORD: ${RESTORE_PGPASSWORD:?required}
      POSTGRES_DB: ${RESTORE_PGDATABASE:?required}
    command: [postgres, -c, max_connections=40]
    volumes: ["restore-postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: &logging
      driver: json-file
      options: {max-size: "5m", max-file: "2"}
  restore-minio:
    image: ${RESTORE_MINIO_IMAGE:-quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z}
    restart: "no"
    cpus: 1.0
    mem_limit: 1g
    pids_limit: 256
    security_opt: ["no-new-privileges:true"]
    command: [server, /data]
    environment:
      MINIO_ROOT_USER: ${RESTORE_S3_ACCESS_KEY:?required}
      MINIO_ROOT_PASSWORD: ${RESTORE_S3_SECRET_KEY:?required}
    volumes: ["restore-minio-data:/data"]
    healthcheck:
      test: [CMD, curl, -fsS, "http://localhost:9000/minio/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *logging
volumes:
  restore-postgres-data:
  restore-minio-data:
