# Disposable full-suite verification stack. Isolated by design: tmpfs database,
# loopback-only listeners, no published ports, no host volumes, no production data.
# The runner fetches origin/main and records the resolved commit in its log, so a
# re-verification is a container restart rather than a stack rewrite.
services:
  postgres:
    image: postgres:16-alpine
    restart: "no"
    cpus: 0.75
    mem_limit: 768m
    pids_limit: 128
    security_opt: ["no-new-privileges:true"]
    environment:
      POSTGRES_USER: bootstrap
      POSTGRES_PASSWORD: disposable-bootstrap-only
      POSTGRES_DB: postgres
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        printf '%s\n' "CREATE ROLE suite LOGIN PASSWORD 'disposable-suite-only' NOSUPERUSER NOCREATEDB NOCREATEROLE;" "CREATE DATABASE nianzeu_test OWNER suite;" "REVOKE CONNECT ON DATABASE postgres FROM PUBLIC;" > /docker-entrypoint-initdb.d/suite.sql
        exec docker-entrypoint.sh postgres -c listen_addresses=127.0.0.1 -c max_connections=60
    tmpfs:
      - /var/lib/postgresql/data:size=536870912
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U suite -d nianzeu_test"]
      interval: 2s
      timeout: 2s
      retries: 40
    logging: &logging
      driver: json-file
      options: {max-size: "5m", max-file: "2"}
  runner:
    image: python:3.13-bookworm
    restart: "no"
    cpus: 1.0
    mem_limit: 2g
    pids_limit: 256
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    network_mode: service:postgres
    depends_on:
      postgres: {condition: service_healthy}
    working_dir: /work
    volumes: ["work:/work"]
    environment:
      DB_URL: postgresql+psycopg://suite:disposable-suite-only@127.0.0.1/nianzeu_test
      UV_NO_CACHE: "1"
      UV_PYTHON_DOWNLOADS: never
      GIT_TERMINAL_PROMPT: "0"
    entrypoint: ["timeout", "--signal=TERM", "--kill-after=10s", "1800s", "/bin/bash", "-ceuo", "pipefail"]
    command:
      - |
        rm -rf /work/source
        git init -q /work/source
        cd /work/source
        git -c credential.helper= fetch --depth=1 https://github.com/tchananet/nianzeu-hub-backend.git main
        git checkout --detach FETCH_HEAD
        echo "SUITE_COMMIT $$(git rev-parse HEAD)"
        python -m pip install --no-cache-dir --quiet uv==0.11.6
        uv sync --locked --python 3.13 --all-groups --all-extras
        uv run --no-sync ruff check .
        uv run --no-sync mypy app
        APP_DATABASE_URL="$$DB_URL" uv run --no-sync alembic upgrade head
        APP_DATABASE_URL="$$DB_URL" uv run --no-sync alembic current
        export TEST_DATABASE_URL="$$DB_URL"
        export IDENTITY_TEST_DATABASE_URL="$$DB_URL"
        export PROFILES_TEST_DATABASE_URL="$$DB_URL"
        export DISCOVERY_TEST_DATABASE_URL="$$DB_URL"
        uv run --no-sync pytest -q -p no:randomly
        echo "SUITE_PASS $$(git rev-parse HEAD)"
    logging: *logging
volumes:
  work:
